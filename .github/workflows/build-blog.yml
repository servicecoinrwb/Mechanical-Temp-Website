name: Build blog

on:
  push:
    branches: [main]
    paths:
      - 'blog-pages/post-template.html'
      - 'blog-pages/index-template.html'
      - 'blog-pages/posts/**'
      - 'blog-pages/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown

      - name: Build blog
        run: |
          cd blog-pages
          python3 build.py --out ..

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild blog [skip ci]"
            git push
          fi
